{{ define "main" }}
  <section class="clean-block clean-blog-list dark">
    <div class="container">
      <div class="block-heading">
        <p class="mb-1"><a href="{{ .Parent.RelPermalink }}">Data Analysis Workflows</a></p>
        <h1 class="h2 text-info">{{ .Title }}</h1>
      </div>
      <div class="block-content instrument-content">
        <div class="row align-items-center">
          <div class="col-lg-5"><img class="rounded img-fluid" src="{{ .Params.header_image }}" alt="{{ .Title }}"></div>
          <div class="col-lg-7">{{ .Content }}</div>
        </div>
        {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
      </div>
    </div>
  </section>
{{ end }}

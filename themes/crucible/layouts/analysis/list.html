{{ define "main" }}
  <section class="clean-block clean-blog-list dark">
    <div class="container">
      <div class="block-heading">
        <h1 class="h2 text-info">Data Analysis Workflows</h1>
      </div>
      <div class="block-content">
        {{ .Content }}
        {{ range .Pages }}
          <div class="clean-blog-post">
            <div class="row">
              <div class="col-lg-5"><img class="rounded img-fluid" src="{{ .Params.header_image }}" alt="{{ .LinkTitle }}"></div>
              <div class="col-lg-7">
                <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
                <p>{{ .Summary }}</p>
              </div>
            </div>
          </div>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
